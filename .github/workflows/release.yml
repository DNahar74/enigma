name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_name: enigma
          - os: linux
            arch: arm64
            binary_name: enigma
          - os: darwin
            arch: amd64
            binary_name: enigma
          - os: darwin
            arch: arm64
            binary_name: enigma
          - os: windows
            arch: amd64
            binary_name: enigma.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.binary_name }} ./cmd/enigma
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -j enigma-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip ${{ matrix.binary_name }}
          else
            tar -czvf enigma-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ${{ matrix.binary_name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
