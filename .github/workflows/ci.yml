name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Build
      run: go build ./...

    - name: Verify formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files found:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

    - name: Test (unit + concurrency)
      run: go test -race ./...

    - name: Verify module dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go mod tidy modified files. Please run 'go mod tidy' locally and commit the changes." && exit 1)

    - name: Install deadcode
      run: go install golang.org/x/tools/cmd/deadcode@latest

    - name: Check for deadcode
      run: deadcode ./...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...
